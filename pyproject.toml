[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
files = ["src/core", "src/extractors", "src/ui/worker.py", "src/cli.py", "src/mcp_server.py"]
check_untyped_defs = true
ignore_missing_imports = true
follow_imports = "silent"
